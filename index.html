<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <script src="https://kit.fontawesome.com/4058489fd7.js" crossorigin="anonymous"></script>
    <title>Murta Music</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
          rel="stylesheet">
</head>
<body>
<div class="container">
    <nav class="sidebar">
        <div class="nav-logo">
            <i class="fa-brands fa-spotify"></i>
        </div>
        <div class="nav-library">
            <p>Sua Biblioteca +</p>
        </div>
        <div class="nav-playlist">
            <h5>Crie sua primeira playlist</h5>
            <p>É fácil, vamos te ajudar.</p>
            <button>Criar playlist</button>
        </div>
        <div class="nav-podcast">
            <h5>Que tal seguir um podcast?</h5>
            <p>Avisaremos você sobre nossos episódios</p>
            <button>Explore Podcast</button>
        </div>
        <div class="nav-footer">
            <a href="#">Legal</a>
            <a href="#">Centro de privacidade</a>
            <a href="#">Política de privacidade</a>
            <a href="#">Cookies</a>
            <a href="#">Sobre anúncios</a>
            <a href="#">Acessibilidade</a>
        </div>
        <button class="nav-language-button">
            <i class="fa-solid fa-globe"></i>
            Português - Br
        </button>
    </nav>
    <main>
        <header class="search-bar">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input placeholder="O que você quer ouvir?">
        </header>
        <section class="content">
            <h2>Artistas Populares</h2>
            <div class="artists-grid"></div>

            <h2>Álbuns Populares</h2>
            <div class="albums-grid"></div>
        </section>

    </main>
</div>
</body>
<script src="script.js"></script>
</html>
