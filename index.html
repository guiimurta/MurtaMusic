<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <script src="https://kit.fontawesome.com/4058489fd7.js" crossorigin="anonymous"></script>
    <title>Murta Music</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <nav>
            <div class="nav-logo">
                <i class="fa-brands fa-spotify"></i>
            </div>
            <div class="nav-library">
                <p>Sua Biblioteca</p>
            </div>
            <div class="nav-playlist">
                <h5>Crie sua primeira playlist</h5>
                <p>É facil, vamos te ajudar.</p>
                <button>Criar playlist</button>
            </div>
            <div class="nav-podcast">
                <h5>Que tal seguir um podcast?</h5>
                <p>Avisarems você sobre nossos episódios</p>
                <button>Explore Podcast</button>
            </div>
            <div class="nav-footer">
                <a href="#">Legal</a>
                <a href="#">Centro de privacidade</a>
                <a href="#">Política de privacidade</a>
                <a href="#">Cookies</a>
                <a href="#">Sobre anúncios</a>
                <a href="#">Acessibilidade</a>
            </div>
            <button class="nav-language-button">
                <i class="fa-solid fa-globe"></i>
                Português - Br
            </button>
        </nav>
        <main>
            <header>
                <i class="fa-solid fa-magnifying-glass"></i>
                <input placeholder="O que você quer ouvir?" class="search-bar">
                <section class="content">
                    <h2>Artistas Populares</h2>
                    <div class="artists-grid"></div>

                    <h2>Álbuns Populares</h2>
                    <div class="albums-grid"></div>
                </section>
            </header>
        </main>
    </div>
</body>
</html>
